name: CI

on:
  push:
    branches:
      - main
      - rewrite/astro-solid
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
